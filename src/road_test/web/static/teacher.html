<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理頁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
<main>
  <p><a href="submit.html">← 回交件頁</a>　<a href="./">委託</a></p>
  <h1>管理頁</h1>

  <form id="login" class="card">
    <label for="api-key">個人 API Key</label>
    <p class="muted">請貼上你現有的個人 API Key，不要重新產生。重新產生會讓 VS Code 裡的那把金鑰失效。</p>
    <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="vcr_sk_…" required>
    <button type="submit">登入</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>

  <div id="admin" hidden>
    <p class="muted">已登入（金鑰只存在這個分頁，關掉分頁就登出）。
      <button type="button" id="logout" class="secondary small">登出</button></p>

    <section class="card">
      <h2>班級</h2>
      <label for="class">要管理的班級</label>
      <select id="class"></select>
    </section>

    <section class="card">
      <h2>正式路考</h2>
      <p class="muted">只開關這個班級。開放期間：模擬路考暫停收件，排隊中的正式路考先跑。關閉後不收正式路考，但關閉前已經收下的照樣跑完、有成績。</p>
      <p><span class="muted">目前</span> <span class="score" id="final-state">—</span></p>
      <button type="button" id="final-open" disabled>開放正式路考</button>
      <button type="button" id="final-close" class="secondary" disabled>關閉正式路考</button>
      <div class="confirm-box" id="final-close-confirm" hidden>
        <p>確定要關閉這個班級的正式路考嗎？之後交的正式路考會被退件。</p>
        <button type="button" data-yes>確定關閉</button>
        <button type="button" class="secondary" data-no>取消</button>
      </div>
    </section>

    <section class="card">
      <h2>組別</h2>
      <p class="muted">學生第一次進路考網站時，從這個班級的組別裡選一組。正式路考的次數以組別計算。</p>
      <div class="table-wrap">
        <table id="groups">
          <thead><tr><th>組別</th><th class="num">正式路考次數</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="no-groups" class="muted" hidden>這個班級還沒有組別，學生會看到「這一班還沒開放路考」。</p>
      <form id="new-group" class="row">
        <label class="inline" for="group-name">組名</label>
        <input id="group-name" type="text" maxlength="40" placeholder="第 1 組" required>
        <label class="inline" for="group-tries">正式路考次數</label>
        <input id="group-tries" type="number" min="1" max="99" step="1" value="1" required>
        <button type="submit">新增組別</button>
      </form>
    </section>

    <p id="notice" class="notice" role="status"></p>
    <p id="error" class="error" role="alert"></p>
  </div>
</main>
<script src="common.js"></script>
<script src="teacher.js"></script>
</body>
</html>
