<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路考結果</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="wide">
<main>
  <p><a href="index.html">← 回交件頁</a></p>
  <h1 id="title">路考結果</h1>
  <p class="muted" id="meta"></p>

  <section class="card" id="status-card">
    <p id="status">讀取中…</p>
    <progress id="progress" max="1" value="0" hidden></progress>
    <p class="muted" id="progress-text"></p>
    <p id="error" class="error" role="alert"></p>
  </section>

  <section class="card" id="score-card" hidden>
    <span class="muted">成績</span> <span class="score" id="score"></span>
    <span class="muted" id="score-detail"></span>
    <div class="conf-slider" id="conf-slider" hidden>
      <label for="conf">CONF <output id="conf-value"></output></label>
      <input type="range" id="conf" min="0.05" max="1" step="0.01">
      <button type="button" id="conf-reset" hidden>回到交件的 CONF</button>
      <p class="muted">拖拖看：CONF 調低，漏看變少、誤判變多。這只是試算，不重新排隊，交件的成績不會變。</p>
      <p class="error" id="conf-error" role="alert"></p>
    </div>
  </section>

  <section id="player"></section>
</main>
<script src="common.js"></script>
<script src="playback.js"></script>
<script src="player.js"></script>
<script src="result.js"></script>
</body>
</html>
