[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "road-test"
version = "0.1.0"
description = "卷積神經網路的路考網站：答案產生、計分、交件與播放。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=11",
    "python-multipart>=0.0.33",
    "scipy>=1.14",
    "uvicorn>=0.30",
]

[project.scripts]
make-answers = "road_test.answers:main"
road-test-site = "road_test.web.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]
# 學生訓練程式才要；裝起來很大，平常不裝
train = ["ultralytics>=8.3", "onnx", "onnxruntime", "onnxslim"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# ultralytics 要 opencv-python（含 GUI，Docker 裡還要 libGL）。網站用 headless 版就夠，
# 兩個都裝會搶同一個 cv2 資料夾，所以把 opencv-python 排除，train 群組也用 headless 的 cv2。
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.setuptools.package-data]
# 前端檔案跟著套件走（Docker 裡不是 editable 安裝）
"road_test.web" = ["static/*"]
